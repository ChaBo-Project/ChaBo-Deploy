services:
  qdrant:
    profiles: ["vectordb"]
    build:
      context: .
      dockerfile: qdrant-native.Dockerfile
    # Published — an external ingestion process needs to reach Qdrant directly, nothing
    # in this compose file writes to it. App-layer key auth only, no TLS — restrict
    # 6333/6334 to known ingestion sources at the VM firewall (see README "Qdrant API keys").
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      # api_key = admin (read/write), read_only_api_key = query-only. Both default to
      # QDRANT_API_KEY below; set QDRANT_READ_ONLY_API_KEY in .env to separate them —
      # see README "Qdrant API keys".
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
      - QDRANT__SERVICE__READ_ONLY_API_KEY=${QDRANT_READ_ONLY_API_KEY:-${QDRANT_API_KEY}}
    volumes:
      - qdrant_data:/data

  tei-embedding:
    profiles: ["local-embedding"]
    platform: linux/amd64
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
    # For GPU, use: ghcr.io/huggingface/text-embeddings-inference:1.9.3
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      - tei-embedding-data:/data
    command: --model-id ${TEI_EMBEDDING_MODEL:-BAAI/bge-m3}
    healthcheck:
      # bge-m3 CPU warmup can take several minutes — budget generously so this isn't
      # marked unhealthy mid-warmup.
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  tei-reranker:
    profiles: ["local-reranker"]
    platform: linux/amd64
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
    # For GPU, use: ghcr.io/huggingface/text-embeddings-inference:1.9.3
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      - tei-reranker-data:/data
    command: --model-id ${TEI_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
    healthcheck:
      # Same reasoning as tei-embedding's healthcheck above.
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  # GUARDRAIL CLASSIFIER — opt-in via the "guard" profile, used by [input_guard] and/or
  # [output_guard] mode=classifier (point either/both at http://qwen3guard:8000). GPU
  # image by default; for CPU-only hosts use a CPU/vLLM-CPU build or a llama.cpp GGUF
  # server (e.g. QuantFactory/Qwen3Guard-Gen-0.6B-GGUF).
  qwen3guard:
    profiles: ["guard"]
    image: vllm/vllm-openai:v0.27.1
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      - qwen3guard-data:/root/.cache/huggingface
    command: >
      --model ${QWEN3GUARD_MODEL:-Qwen/Qwen3Guard-Gen-0.6B}
      --host 0.0.0.0 --port 8000 --max-model-len 32768
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  chabo:
    # Published orchestrator image, pinned tag (no :latest published) — no application
    # source lives in ChaBo-Deploy (Guidelines A3.4).
    image: ghcr.io/chabo-project/chabo-rag-orchestrator:${ORCHESTRATOR_TAG:?ORCHESTRATOR_TAG must be set, e.g. 0.9.1}
    depends_on:
      # required: false — don't fail `docker compose up chabo` when these profiles are off.
      tei-embedding:
        condition: service_healthy
        required: false
      tei-reranker:
        condition: service_healthy
        required: false
      # For classifier-mode input guard, also run `--profile guard` and uncomment:
      # qwen3guard:
      #   condition: service_healthy
      #   required: false
    ports:
      - "7860:7860"
    environment:
      # Required even for self-hosted, non-HF setups — any placeholder value works if
      # nothing HF-hosted is configured (see README "No Hugging Face access?").
      - HF_TOKEN=${HF_TOKEN:?HF_TOKEN must be set}
      # Prefers the read-only key if set, else the admin key (chabo only ever queries).
      - QDRANT_API_KEY=${QDRANT_READ_ONLY_API_KEY:-${QDRANT_API_KEY:?QDRANT_API_KEY must be set}}
      - INSTANCE_CONFIG_DIR=/app/instance_config
      # Uncomment if using alternative LLM providers:
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - COHERE_API_KEY=${COHERE_API_KEY}
    volumes:
      - ${INSTANCE_CONFIG_PATH:?INSTANCE_CONFIG_PATH must point at this instance's instance_config directory}:/app/instance_config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  chatui:
    profiles: ["chatui"]
    build:
      context: .
      dockerfile: chatui.Dockerfile
      args:
        CHATUI_TAG: ${CHATUI_TAG:-0.9.4-chabo}
    ports:
      - "3000:3000"
    # Non-HTTPS testing: set UI_ORIGIN in .env, then enable this:
    # environment:
    #   - ORIGIN=${UI_ORIGIN}
    volumes:
      - ${CHATUI_ENV_LOCAL_PATH:-./chatui.env.local}:/app/.env.local:ro
      - chatui-db:/data/db
      - chatui-models:/data/models
    depends_on:
      chabo:
        condition: service_healthy

volumes:
  chatui-db:
  chatui-models:
  qdrant_data:
  tei-embedding-data:
  tei-reranker-data:
  qwen3guard-data:
