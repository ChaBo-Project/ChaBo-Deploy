# Tier-1 pipeline-behavior overrides for this instance.
#
# Layered on top of the published image's baked-in params.cfg via
# configparser.read([base, override]) — only keys you uncomment/set here
# override the generic default; everything else falls through unchanged.
# Full contract: chabo/README.md's "Instance Configuration" section.
# Every section/key below mirrors params.cfg exactly, so nothing is hidden —
# uncomment and fill in whatever this instance actually needs to override.
#
# Sections/keys left active (not commented) are REQUIRED for a working deploy.
# Everything commented out is optional — leave it that way to inherit the base
# image's default, or uncomment and fill in to override it.
#
# [ragas] is intentionally not included here — it's eval-only (tests/eval/eval.py),
# never read by the running application, so it has no place in a deploy instance's config.

[hf_endpoints]
embedding_endpoint_url = <fill in>
reranker_endpoint_url = <fill in>
# For local TEI endpoints instead (requires the local-embedding/local-reranker
# compose profiles — see compose/README.md):
# embedding_endpoint_url = http://tei-embedding:80
# reranker_endpoint_url = http://tei-reranker:80

[qdrant]
# Modes: 'native' for direct QdrantClient, 'gradio' for Gradio Gateway access.
# This topology (docker-compose) talks to Qdrant directly — use native.
mode = native
# Self-hosting Qdrant via this compose file's `vectordb` profile? The service is
# reachable at its compose DNS name:
url = qdrant
port = 6333
collection = <fill in>
# Using a remote/managed Qdrant instead of the `vectordb` profile? Point url at
# it instead, e.g.:
# url = https://my-managed-qdrant.example.com
# Optional TLS override. Leave commented to derive automatically.
# https = false
# NOTE: the api key is passed via this stack's QDRANT_API_KEY/QDRANT_READ_ONLY_API_KEY
# env vars (see .env.example) — never committed here.

[retrieval]
# Optional — uncomment and adjust any of these to override the base defaults;
# safe to leave the whole section commented to inherit them as-is.
# top_k = 20
# reranker_enabled = true
# reranker_top_k = 5
# hybrid_enabled = false
# prefetch_top_k = 100
# sparse_model = Qdrant/bm25
# sparse_language = english
# dense_weight = 0.5
# sparse_weight = 0.5
# rrf_k = 60

[generator]
PROVIDER = <fill in, e.g. huggingface, openai, anthropic, cohere, azure>
MODEL = <fill in>
MAX_TOKENS = 1024
TEMPERATURE = 0.1
# INFERENCE_PROVIDER = <required for provider huggingface>
# ORGANIZATION = <required for provider huggingface>
# CONTEXT_META_FIELDS = filename,project_id,document_source
TITLE_META_FIELDS = filename,page
# AZURE_ENDPOINT = <required for provider azure>

# [ingestor]
# chunk_size = 700
# chunk_overlap = 50
# max_chunks = 20
# separators = \n\n,\n,. ,! ,? , ,

# [conversation_history]
# MAX_TURNS = 3
# MAX_CHARS = 8000

[metadata_filters]
# Optional feature, off by default — leaving filterable_fields empty/commented
# makes extract_filters_node a pass-through. To enable: set filterable_fields AND
# fill in the llm_* keys below AND add matching entries under `filters:` in
# instance.yaml.
# Types: str, int, list.
# filterable_fields = <field>:<type>,...
# llm_provider = huggingface
# llm_model = <fill in>
# llm_max_tokens = 256
# llm_temperature = 0.1
# llm_inference_provider = <required for huggingface>
# llm_organization = <required for huggingface>

[query_rewriter]
# Enabled by default in the base image. Requires llm_* below to be filled in for
# a working deploy — or set enabled = false instead if you don't need this feature.
enabled = true
# ISO code, e.g. "ar"; empty = no cross-lingual rewrite.
# target_language =
llm_provider = <fill in>
llm_model = <fill in>
llm_max_tokens = 256
llm_temperature = 0.1
# llm_inference_provider = <required for huggingface>
# llm_organization = <required for huggingface>
# NOTE: grounding (abstract/glossary) comes from instance.yaml's db_context key.

[input_guard]
# Optional feature, off by default.
enabled = false
# mode = llm
# Required for mode = classifier — point at this stack's qwen3guard service
# (requires the `guard` compose profile — see compose/README.md):
# endpoint_url = http://qwen3guard:8000
# llm_provider = huggingface
# llm_model = <fill in>
# llm_max_tokens = 64
# llm_temperature = 0.0
# llm_inference_provider = <required for huggingface>
# llm_organization = <required for huggingface>
# block_controversial = false
# timeout_s = 2.0
# blocked_message = I'm sorry, but I can't help with that request.

[output_guard]
# Two independent sub-features, both off by default.
classification_enabled = false
# mode = llm
# endpoint_url = http://qwen3guard:8000
# model = Qwen/Qwen3Guard-Gen-0.6B
# llm_provider = huggingface
# llm_model = <fill in>
# llm_max_tokens = 16
# llm_temperature = 0.0
# llm_inference_provider = <required for huggingface>
# llm_organization = <required for huggingface>
# window_chars = 200
# block_controversial = true
# timeout_s = 5.0
# classification_message = This application is not able to answer certain queries. Please try again.
# guideline_enforcement = off

blocklist_enabled = false
# blocklist_path = src/components/guardrails/blocklist.txt
# blocklist_message = There was an error in the output. Please try again.
